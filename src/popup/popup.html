<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title data-i18n="popup.title">HistorySentry - 历史记录管理</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container" id="popup-container">
    <!-- 顶部栏 -->
    <header class="header">
      <div class="brand">
        <img class="brand-icon" src="../icons/icon32.png" alt="HistorySentry Logo" width="20" height="20">
        <span class="brand-title">HistorySentry</span>
      </div>
      <div class="header-actions">
        <div class="silent-dropdown" id="silent-dropdown">
          <button id="btn-silent-mode" class="capsule-btn silent-btn" aria-haspopup="listbox" aria-expanded="false" data-i18n-title="popup.silentTooltip" title="开启后在所选时间内一切新浏览均不留痕">
            <span class="silent-icon">🕶️</span>
            <span id="silent-text" data-i18n="popup.silentBtn">临时无痕 30m</span>
            <svg class="dropdown-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <div id="silent-dropdown-menu" class="silent-dropdown-menu hidden" role="listbox">
            <button type="button" class="silent-dropdown-item silent-exit-item hidden" id="item-silent-exit" role="option">
              <span class="item-icon">✕</span>
              <span class="item-text" data-i18n="popup.silentExit">退出临时无痕</span>
            </button>
            <div class="silent-dropdown-divider hidden" id="silent-menu-divider"></div>
            <button type="button" class="silent-dropdown-item" data-duration="15" role="option">
              <span class="item-text" data-i18n="options.duration15m">15 分钟</span>
              <span class="item-badge hidden"></span>
            </button>
            <button type="button" class="silent-dropdown-item" data-duration="30" role="option">
              <span class="item-text" data-i18n="options.duration30m">30 分钟</span>
              <span class="item-badge hidden"></span>
            </button>
            <button type="button" class="silent-dropdown-item" data-duration="60" role="option">
              <span class="item-text" data-i18n="options.duration60m">1 小时</span>
              <span class="item-badge hidden"></span>
            </button>
            <button type="button" class="silent-dropdown-item" data-duration="120" role="option">
              <span class="item-text" data-i18n="options.duration120m">2 小时</span>
              <span class="item-badge hidden"></span>
            </button>
            <button type="button" class="silent-dropdown-item" data-duration="240" role="option">
              <span class="item-text" data-i18n="options.duration240m">4 小时</span>
              <span class="item-badge hidden"></span>
            </button>
            <button type="button" class="silent-dropdown-item" data-duration="480" role="option">
              <span class="item-text" data-i18n="options.duration480m">8 小时</span>
              <span class="item-badge hidden"></span>
            </button>
            <button type="button" class="silent-dropdown-item" data-duration="720" role="option">
              <span class="item-text" data-i18n="options.duration720m">12 小时</span>
              <span class="item-badge hidden"></span>
            </button>
          </div>
        </div>
        <button id="btn-open-options" class="icon-btn" data-i18n-title="popup.optionsTooltip" title="打开管理控制台">
          <svg class="gear-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
        <!-- 关闭/暂停防护紧凑下拉按钮 -->
        <div class="pause-dropdown" id="pause-dropdown">
          <button id="btn-pause-mode" class="icon-btn pause-btn" aria-haspopup="listbox" aria-expanded="false" data-i18n-title="popup.pauseTooltip" title="暂停或关闭历史防护">
            <svg class="pause-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
              <line x1="12" y1="2" x2="12" y2="12"></line>
            </svg>
            <span id="pause-badge-dot" class="pause-badge-dot hidden"></span>
          </button>
          <div id="pause-dropdown-menu" class="pause-dropdown-menu hidden" role="listbox">
            <button type="button" class="pause-dropdown-item pause-resume-item hidden" id="item-pause-resume" role="option">
              <span class="item-icon">▶</span>
              <span class="item-text" data-i18n="popup.pauseResume">立即恢复防护</span>
            </button>
            <div class="pause-dropdown-divider hidden" id="pause-menu-divider"></div>
            <button type="button" class="pause-dropdown-item" data-duration="15" role="option">
              <span class="item-text">临时关闭 15 分钟</span>
            </button>
            <button type="button" class="pause-dropdown-item" data-duration="30" role="option">
              <span class="item-text">临时关闭 30 分钟</span>
            </button>
            <button type="button" class="pause-dropdown-item" data-duration="60" role="option">
              <span class="item-text">临时关闭 1 小时</span>
            </button>
            <button type="button" class="pause-dropdown-item" data-duration="120" role="option">
              <span class="item-text">临时关闭 2 小时</span>
            </button>
            <button type="button" class="pause-dropdown-item" data-duration="240" role="option">
              <span class="item-text">临时关闭 4 小时</span>
            </button>
            <button type="button" class="pause-dropdown-item" data-duration="480" role="option">
              <span class="item-text">临时关闭 8 小时</span>
            </button>
            <button type="button" class="pause-dropdown-item" data-duration="720" role="option">
              <span class="item-text">临时关闭 12 小时</span>
            </button>
            <div class="pause-dropdown-divider"></div>
            <button type="button" class="pause-dropdown-item" data-duration="manual" role="option">
              <span class="item-text" data-i18n="popup.pauseForever">一直关闭到下次开启</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- 防护已暂停提示横幅 (默认隐藏，暂停时显示) -->
    <div id="paused-protection-banner" class="card paused-banner hidden">
      <div class="paused-banner-header">
        <div class="paused-banner-title-box">
          <span class="paused-icon">⏸️</span>
          <span class="paused-title" data-i18n="popup.pauseBannerTitle">防护已暂停</span>
          <span id="paused-countdown-text" class="paused-countdown-badge"></span>
        </div>
        <button id="btn-banner-resume" class="btn-banner-resume" data-i18n="popup.pauseResume">立即恢复</button>
      </div>
      <div class="paused-desc" data-i18n="popup.pauseBannerDesc">当前不会拦截任何历史记录，浏览器将正常保存浏览足迹。</div>
    </div>

    <!-- 当前页状态框 -->
    <div id="status-card" class="card status-card">
      <div class="status-header">
        <span class="status-label" data-i18n="popup.currentTab">当前标签页</span>
        <span id="tab-status-badge" class="badge badge-normal" data-i18n="popup.statusChecking">● 检测中...</span>
      </div>
      <div id="tab-url-text" class="tab-url" title="" data-i18n="popup.statusLoading">加载中...</div>

      <!-- 命中保护规则时的快捷移除横幅 (默认隐藏) -->
      <div id="matched-rule-banner" class="matched-banner hidden">
        <div class="matched-info">
          <span class="matched-icon">🛡️</span>
          <span id="matched-rule-text" class="matched-text">已处于防护规则中</span>
        </div>
        <button id="btn-remove-matched-rule" class="btn-remove-rule" data-i18n-title="popup.removeFromListTitle" title="移除此规则，恢复记录该站历史">
          <span class="remove-icon">🗑️</span>
          <span data-i18n="popup.removeFromList">移除此防护规则</span>
        </button>
      </div>
    </div>

    <!-- 内部页面提示 (默认隐藏) -->
    <div id="internal-page-tip" class="card alert-card hidden">
      <div class="alert-icon">⚠️</div>
      <div class="alert-content">
        <div class="alert-title" data-i18n="popup.internalTitle">浏览器内部页面</div>
        <div class="alert-desc" data-i18n="popup.internalDesc">内部系统页面不产生历史记录，无需设置防护规则。</div>
      </div>
    </div>

    <!-- 正常页面主交互区 -->
    <main id="main-content">
      <!-- 区块 1：按域名层级防护 -->
      <section class="section">
        <div class="section-title">
          <span data-i18n="popup.domainSection">按域名层级防护</span>
          <span class="section-hint" data-i18n="popup.domainHint">单选</span>
        </div>
        <div id="domain-capsules-group" class="capsule-group">
          <!-- 动态注入域名胶囊 -->
        </div>
      </section>

      <!-- 区块 2：按 URL 路径层级防护 -->
      <section class="section">
        <div class="section-title">
          <span data-i18n="popup.pathSection">按 URL 路径层级防护</span>
        </div>
        <div id="path-capsules-group" class="capsule-group">
          <!-- 动态注入路径胶囊 -->
        </div>
      </section>

      <!-- 回溯清理与操作按钮 -->
      <div class="action-section">
        <label class="checkbox-label" for="cb-retroactive">
          <input type="checkbox" id="cb-retroactive" checked>
          <span class="custom-checkbox"></span>
          <span class="checkbox-text" id="retroactive-label-text">同时彻底清理已有的 0 条历史记录</span>
        </label>

        <div class="btn-group">
          <button id="btn-hide-and-clean" class="btn btn-primary">
            <span class="btn-icon">🛡️</span>
            <span id="btn-hide-text" class="btn-text" data-i18n="popup.hideAndClean">防护并清理</span>
          </button>
          <button id="btn-clean-only" class="btn btn-danger-outline" data-i18n-title="popup.cleanOnlyTitle" title="仅清理匹配的历史记录，不增加规则">
            <span class="btn-icon">🗑️</span>
            <span id="btn-clean-text" class="btn-text">仅删 0 条</span>
          </button>
        </div>
      </div>
    </main>

    <!-- 轻量级操作反馈 Toast 浮层 -->
    <div id="toast" class="toast hidden">操作成功</div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
